<div class="hero">
  <p class="eyebrow">Loaded</p>
  <h1>Reset your <span>password.</span></h1>
  <p class="sub">Enter your email and we'll send you a link to reset it.</p>
</div>

<div class="clipboard">
  @if (submitted()) {
    <p class="sub">Check your inbox for a password reset link. It may take a minute to arrive.</p>
  } @else {
    <form (ngSubmit)="submit()">
      <div class="field">
        <label>Email</label>
        <div class="unit-input">
          <input type="email" name="email" [(ngModel)]="email" required autocomplete="email" />
        </div>
      </div>
      <button class="go-btn" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Sending...' : 'Send reset link' }}
      </button>
      @if (errorMsg()) {
        <div class="error-box">{{ errorMsg() }}</div>
      }
    </form>
  }
  <hr class="divider" />
  <p class="sub">Remembered it? <a routerLink="/login" style="color: var(--brass)">Log in</a></p>
</div>
