<div class="hero">
  <p class="eyebrow">Loaded</p>
  <h1>Choose a new <span>password.</span></h1>
  <p class="sub">Set a new password for your account.</p>
</div>

<div class="clipboard">
  <form (ngSubmit)="submit()">
    <div class="field">
      <label>New password</label>
      <div class="unit-input">
        <input type="password" name="password" [(ngModel)]="password" required minlength="6" autocomplete="new-password" />
      </div>
    </div>
    <div class="field">
      <label>Confirm password</label>
      <div class="unit-input">
        <input type="password" name="confirmPassword" [(ngModel)]="confirmPassword" required minlength="6" autocomplete="new-password" />
      </div>
    </div>
    <button class="go-btn" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Saving...' : 'Save new password' }}
    </button>
    @if (errorMsg()) {
      <div class="error-box">{{ errorMsg() }}</div>
    }
  </form>
  <hr class="divider" />
  <p class="sub"><a routerLink="/login" style="color: var(--brass)">Back to login</a></p>
</div>
