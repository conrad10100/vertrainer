spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

supabase.jwt.jwks-uri=${SUPABASE_JWKS_URI:}
supabase.jwt.issuer=${SUPABASE_ISSUER:}
supabase.jwt.legacy-hs256-secret=${SUPABASE_LEGACY_JWT_SECRET:}

anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5}

voyage.api-key=${VOYAGE_API_KEY}

# Knowledge-base ingestion accepts PDF/text uploads (studies) -- default 1MB is too small.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.cors.allowed-origin=${APP_CORS_ORIGIN:http://localhost:4200}
app.admin.emails=${ADMIN_EMAILS:}
