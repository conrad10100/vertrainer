name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Testcontainers' bundled docker-java client (pinned via the 1.20.4 testcontainers-bom)
      # probes the daemon with a hardcoded, very old default API version (1.32) before
      # negotiating up -- newer Docker Engine releases on the runner image reject that outright
      # ("client version 1.32 is too old") instead of negotiating, so pin a modern version here
      # to skip the broken probe. Remove once testcontainers-bom is upgraded past this behavior.
      DOCKER_API_VERSION: '1.44'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: ./mvnw -B test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
